name: Verify portfolio links and PWA assets
on:
  pull_request:
    paths: ['main.js', 'index.html', 'manifest.json', 'sw.js', 'building-scalable-ai-solutions.html', 'tests/**', '.github/workflows/verify.yml']
  push:
    branches: [main]
    paths: ['main.js', 'index.html', 'manifest.json', 'sw.js', 'building-scalable-ai-solutions.html', 'tests/**', '.github/workflows/verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - name: Render project cards in headless Chrome
        run: |
          set -euo pipefail
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/portfolio-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage --virtual-time-budget=4500 --dump-dom http://127.0.0.1:8766/index.html > /tmp/portfolio-rendered.html
          grep -q 'View repository' /tmp/portfolio-rendered.html
          grep -q 'View archived screenshot' /tmp/portfolio-rendered.html
          grep -q 'RescuePC Repairs' /tmp/portfolio-rendered.html

