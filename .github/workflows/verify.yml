name: Verify portfolio links and PWA assets
on:
  pull_request:
    paths: ['main.js', 'index.html', 'manifest.json', 'sw.js', 'building-scalable-ai-solutions.html', 'tests/**', '.github/workflows/verify.yml']
  push:
    branches: [main]
    paths: ['main.js', 'index.html', 'manifest.json', 'sw.js', 'building-scalable-ai-solutions.html', 'tests/**', '.github/workflows/verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
